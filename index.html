<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SHIBA LOOP" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%90%95</text></svg>" />
    <title>SHIBA LOOP</title>
    <style>
      :root {
        --ink: #f4efe6;
        --dim: rgba(244, 239, 230, 0.6);
        --panel: rgba(12, 14, 20, 0.7);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; }
      /* 巻き戻し中だけ画面を歪ませる */
      #stage.rewinding { filter: hue-rotate(-30deg) saturate(1.5) contrast(1.15); }
      #stage.rewinding::after {
        content: "";
        position: absolute; inset: 0; pointer-events: none;
        background:
          repeating-linear-gradient(0deg, rgba(150, 215, 255, 0.16) 0 2px, transparent 2px 5px),
          radial-gradient(ellipse at center, transparent 38%, rgba(8, 16, 34, 0.72) 100%);
      }

      .hud { position: fixed; pointer-events: none; user-select: none; }

      /* 左上：飼い主の体力 */
      #hp {
        top: 14px; left: 16px;
        display: flex; align-items: center; gap: 8px;
        font-size: 12px; letter-spacing: 0.1em; color: var(--dim);
      }
      #hp .pips { display: flex; gap: 5px; }
      #hp .pip {
        width: 15px; height: 15px; border-radius: 4px;
        background: #d8534f;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
      }
      #hp .pip.lost { background: rgba(255,255,255,0.16); }

      /* 右上：操作 */
      #keyPanel {
        top: 12px; right: 16px;
        font: 11px/1.7 ui-monospace, Menlo, monospace;
        color: var(--dim); background: var(--panel);
        padding: 6px 10px; border-radius: 6px;
        text-align: right; white-space: pre;
      }
      body.touch #keyPanel { display: none; }

      /* 左下：デバッグ */
      #debugPanel {
        bottom: 10px; left: 12px;
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        color: var(--dim); background: var(--panel);
        padding: 5px 9px; border-radius: 6px; white-space: pre;
        display: none;
      }
      body.debug #debugPanel { display: block; }

      /* 中央下：今やること */
      #hint {
        bottom: 42px; left: 50%; transform: translateX(-50%);
        font-size: 15px; letter-spacing: 0.04em;
        background: var(--panel); padding: 9px 18px;
        border-radius: 999px; border: 1px solid rgba(255,255,255,0.12);
        opacity: 0; transition: opacity 220ms ease; white-space: nowrap;
      }
      #hint.show { opacity: 1; }
      body.touch #hint { bottom: 152px; }

      /* 飼い主のセリフ */
      #speech {
        position: fixed; transform: translate(-50%, -100%);
        background: rgba(250,250,252,0.94); color: #14161c;
        font-size: 14px; padding: 7px 13px; border-radius: 12px;
        white-space: nowrap; pointer-events: none; opacity: 0;
        transition: opacity 160ms ease; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      }
      #speech::after {
        content: ""; position: absolute; left: 50%; bottom: -7px;
        margin-left: -6px; border: 6px solid transparent;
        border-top-color: rgba(250,250,252,0.94); border-bottom: 0;
      }
      #speech.show { opacity: 1; }

      /* 全画面 */
      #overlay {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; text-align: center;
        background: rgba(6,7,11,0); opacity: 0; pointer-events: none;
        transition: opacity 400ms ease, background 400ms ease;
      }
      #overlay.show { opacity: 1; pointer-events: none; }
      #overlay.dark { background: rgba(6,7,11,0.82); }
      #overlay.black { background: #06070b; }
      #overlayTitle { font-size: 40px; letter-spacing: 0.34em; margin-left: 0.34em; font-weight: 300; }
      #overlayText { font-size: 15px; color: var(--dim); line-height: 1.9; }
      #overlayAction {
        margin-top: 6px; font-size: 16px; color: #ffd678;
        border: 1px solid rgba(255,214,120,0.6); border-radius: 999px;
        padding: 10px 24px; cursor: pointer; background: rgba(255,214,120,0.06);
        font-family: inherit; pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      .hidden { display: none !important; }

      /* タッチ操作 */
      #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
      body.touch #touch { display: block; }
      #stickZone {
        position: absolute; left: 0; bottom: 0;
        width: 46%; height: 62%;
        pointer-events: auto; touch-action: none;
      }
      #stickBase {
        position: absolute; width: 126px; height: 126px; margin: -63px 0 0 -63px;
        border-radius: 50%; border: 2px solid rgba(255,255,255,0.26);
        background: rgba(255,255,255,0.06); opacity: 0; transition: opacity 120ms ease;
      }
      #stickBase.show { opacity: 1; }
      #stickKnob {
        position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
        border-radius: 50%; background: rgba(255,255,255,0.7); transform: translate(-50%, -50%);
      }
      #touchButtons {
        position: absolute;
        right: calc(20px + env(safe-area-inset-right));
        bottom: calc(24px + env(safe-area-inset-bottom));
        display: flex; gap: 14px; align-items: flex-end; pointer-events: none;
      }
      #touchButtons button {
        pointer-events: auto; touch-action: none;
        width: 92px; height: 92px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.32);
        background: rgba(20,24,32,0.5); color: var(--ink);
        font-family: inherit; font-size: 15px; letter-spacing: 0.05em;
        -webkit-tap-highlight-color: transparent;
      }
      #touchButtons button.active {
        background: rgba(255,214,120,0.32); border-color: rgba(255,214,120,0.85);
      }
      #btnJump { width: 108px; height: 108px; font-size: 16px; }

      #rotateHint {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
        display: none; font-size: 13px; background: var(--panel);
        padding: 7px 14px; border-radius: 999px; pointer-events: none;
      }
      @media (orientation: portrait) { body.touch #rotateHint { display: block; } }

      #noscript {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; padding: 32px; text-align: center; line-height: 2;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div id="hp" class="hud"><span>飼い主</span><span class="pips"></span></div>
    <div id="keyPanel" class="hud">← → / A D : 走る
Space / W : ジャンプ
J : かみつき
K / Shift : ダッシュ
R : やり直す　H : デバッグ</div>
    <div id="debugPanel" class="hud"></div>
    <div id="hint" class="hud"></div>
    <div id="speech"></div>

    <div id="touch">
      <div id="stickZone"></div>
      <div id="stickBase"><div id="stickKnob"></div></div>
      <div id="touchButtons">
        <button id="btnDash" type="button">ダッシュ</button>
        <button id="btnBite" type="button">かみつき</button>
        <button id="btnJump" type="button">ジャンプ</button>
      </div>
    </div>
    <div id="rotateHint">横向きにすると遊びやすい</div>

    <div id="overlay">
      <div id="overlayTitle"></div>
      <div id="overlayText"></div>
      <button id="overlayAction" type="button" class="hidden"></button>
    </div>

    <noscript>
      <div id="noscript">
        このページは JavaScript で描画します。<br />
        スクリプトが動かない環境では何も表示されません。
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
